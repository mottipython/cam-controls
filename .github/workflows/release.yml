name: Build & Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Packaging & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cargo rustc libxkbcommon-dev libfontconfig1-dev rpm binutils tar python3

      - name: Build All Distribution Packages (Rust & Python)
        run: |
          make packages

      - name: List Generated Packages
        run: |
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
