name: CI Package & Installation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-debian:
    name: Ubuntu VM (.deb test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils desktop-file-utils python3 python3-tk

      - name: Build Debian Package (.deb)
        run: make deb

      - name: Install .deb Package
        run: |
          sudo dpkg -i dist/cam-controls_*_all.deb

      - name: Verify Executable & Desktop Entry
        run: |
          cam-controls --version
          cam-controls --help
          desktop-file-validate /usr/share/applications/cam-controls.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/cam-controls.svg
          test -f /usr/share/cam-controls/99-disable-libcamera.conf

      - name: Test Package Removal
        run: |
          sudo dpkg -r cam-controls
          ! which cam-controls

  test-rpm:
    name: Fedora VM (.rpm test)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install Tools & Dependencies
        run: |
          dnf install -y git make rpm-build python3 python3-tkinter desktop-file-utils tar binutils

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory '*'

      - name: Build RPM Package (.rpm)
        run: make rpm

      - name: Install .rpm Package
        run: |
          dnf install -y dist/cam-controls-*.noarch.rpm

      - name: Verify Executable & Desktop Entry
        run: |
          cam-controls --version
          cam-controls --help
          desktop-file-validate /usr/share/applications/cam-controls.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/cam-controls.svg
          test -f /usr/share/cam-controls/99-disable-libcamera.conf

      - name: Test Package Removal
        run: |
          dnf remove -y cam-controls
          ! which cam-controls

  test-source:
    name: Source Install Test (make install)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install from Source
        run: |
          sudo make install

      - name: Verify Executable
        run: |
          cam-controls --version
          cam-controls --help

      - name: Uninstall from Source
        run: |
          sudo make uninstall
          ! which cam-controls
