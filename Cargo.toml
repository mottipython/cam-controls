[package]
name = "cam-controls"
version = "2.0.0"
edition = "2021"
authors = ["Motti Schleider <motti.schleider@gmail.com>"]
description = "High-performance camera image tuning utility & PipeWire fix for Linux"
license = "MIT"
repository = "https://github.com/mottipython/cam-controls"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
