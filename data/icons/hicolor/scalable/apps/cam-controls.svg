<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="glareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Body -->
  <rect x="14" y="24" width="100" height="80" rx="22" fill="url(#bgGrad)" filter="drop-shadow(0px 8px 12px rgba(0,0,0,0.3))"/>
  
  <!-- Top button -->
  <rect x="36" y="16" width="22" height="10" rx="4" fill="#60a5fa"/>
  
  <!-- Outer Lens Ring -->
  <circle cx="64" cy="64" r="30" fill="#1e293b"/>
  <circle cx="64" cy="64" r="25" fill="url(#lensGrad)"/>
  <circle cx="64" cy="64" r="18" fill="#0284c7"/>
  <circle cx="64" cy="64" r="10" fill="#082f49"/>
  <circle cx="60" cy="60" r="4" fill="url(#glareGrad)"/>
  
  <!-- Sliders indicator pill at bottom right -->
  <circle cx="96" cy="38" r="4" fill="#22c55e"/>
  
  <!-- Sliders mini accent -->
  <rect x="84" y="80" width="20" height="4" rx="2" fill="#93c5fd"/>
  <circle cx="96" cy="82" r="4" fill="#ffffff"/>
</svg>
